name: cn159e_app
description: CN159E Mechatronics English – Offline Mobile Learning & Mock Exam App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.2
  intl: ^0.19.0
  path_provider: ^2.1.5
  file_picker: ^8.1.4
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/vocabulary.json
    - assets/data/questions.json
    - assets/data/translations.json
